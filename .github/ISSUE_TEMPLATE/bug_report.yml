name: Bug report
description: Report a reproducible problem with lean-music-app
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, cookies, account identifiers, or other sensitive data. Report security issues privately under the Security tab.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 15.6, Apple silicon
    validations:
      required: true
  - type: input
    id: safari
    attributes:
      label: Safari version
      description: WKWebView behavior is tied to the installed system WebKit version.
      placeholder: Safari 26.0
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session state
      options:
        - Signed out
        - Signed in
        - Unknown or not relevant
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Explain what you did and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add non-sensitive logs or screenshots if useful.
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed passwords, cookies, account identifiers, and other private data.
          required: true
