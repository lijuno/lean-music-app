name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Run checks
        run: ./Scripts/test.sh

      - name: Build debug executable
        run: swift build

      - name: Assemble universal app
        run: ./Scripts/build-app.sh

      - name: Verify bundle, architectures, identity, and sandbox
        run: ./Scripts/verify-app.sh
